# @package resources
#
# Job size. Null fields are not requested from the scheduler.

defaults:
  - base_resources
  - _self_

nnodes: 1
# null: use the GPUs visible on the node
gpus_per_node: null
cpus_per_node: 8
mem: "32gb"
walltime: "4:00:00"
omp_num_threads: 8
# Queue/partition override (null = use cluster.queue)
queue: null
