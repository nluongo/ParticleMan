# ParticleMan Training Configuration: bbllv08
#
# This is the root configuration that composes all sub-configs.
#
# Usage:
#   python scripts/train.py --config-name=bbllv08
#
# Override any value via CLI:
#   python scripts/train.py --config-name=bbllv08 training.epochs=20
#
# Switch sub-configs:
#   python scripts/train.py --config-name=bbllv08 model=default

defaults:
  - base_config
  - data: bbllv08
  - model: joint_sincos
  - training: default
  - output: bbll
  - distributed: default
  - _self_

# Hydra configuration
hydra:
  run:
    # Disable Hydra's automatic output directory management
    # We use OutputManager instead for consistent output structure
    dir: .
  output_subdir: null
  job:
    # Don't change working directory
    chdir: false
