# @package distributed
#
# Default distributed training configuration for ParticleMan

# Backend: "nccl" (GPU, recommended) or "gloo" (CPU)
defaults:
  - base_distributed
  - _self_

backend: nccl
# Process group initialization timeout in seconds (raise for large multi-node jobs)
timeout_s: 60
# Rank info is detected from launcher env vars (torchrun, srun, mpiexec);
# see particleman.training.distributed.detect_rank_info.
