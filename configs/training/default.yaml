# @package training
#
# Default training hyperparameters for ParticleMan

# Number of training epochs
epochs: 10
# Batch size per GPU
batch_size: 32
# Learning rate
lr: 1.0e-4
# Weight decay for AdamW optimizer
weight_decay: 0.01
# Probability of masking each particle for pre-training
mask_prob: 0.15
# Probability of masking the event label during pre-training
event_label_mask_prob: 0.15
# Number of data loading workers
num_workers: 32
# Gradient accumulation steps (for effective larger batch sizes)
gradient_accumulation_steps: 1
# Enable torch.profiler to trace the training loop
profile: false
# Path to a pretrained checkpoint to load model weights from (null = train from scratch)
pretrained_checkpoint: null
# Training mode: 'pretrain' (masked particle prediction) or 'classify' (supervised classification)
mode: pretrain
