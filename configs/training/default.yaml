# @package training
#
# Default training hyperparameters for ParticleMan

# Number of training epochs
epochs: 10
# Batch size per GPU
batch_size: 256
# Learning rate
lr: 1.0e-4
# Weight decay for AdamW optimizer
weight_decay: 0.01
# Probability of masking each particle for pre-training
mask_prob: 0.15
# Number of data loading workers
num_workers: 0
# Gradient accumulation steps (for effective larger batch sizes)
gradient_accumulation_steps: 1
