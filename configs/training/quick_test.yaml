# @package training
#
# Quick test training configuration
# Uses fewer epochs and smaller batches for fast iteration.
#
# Usage:
#   python scripts/run.py training=quick_test

defaults:
  - base_training
  - _self_

epochs: 2
batch_size: 64
lr: 1.0e-4
weight_decay: 0.01
mask_prob: 0.15
num_workers: 0
# Keep DataLoader workers alive between epochs (ignored when num_workers=0)
persistent_workers: false
gradient_accumulation_steps: 1
