# @package output
#
# Output configuration for mc20 ttbar experiments

# Base directory for all outputs (checkpoints, logs, etc.)
defaults:
  - base_output
  - _self_

output_dir: outputs

# Experiment name (groups related runs)
experiment_name: ParticleMan_bbll
# Timestamp portion of run_name, supplied during job submission
timestamp: null
# Run name (null for auto-generated timestamp)
run_name: null

# How often to log training stats (in steps)
log_interval: 1
# Experiment logger: "mlflow", "comet", "noop", or "none"
experiment_logger: mlflow
# MLflow experiment path prefix, e.g. "/Users/<email>" for Databricks (null = none)
mlflow_experiment_prefix: null
