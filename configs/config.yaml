defaults:
  - base_config
  - data: default.yaml
  - model: default.yaml
  - training: default.yaml
  - output: default.yaml
  - distributed: default.yaml
  - cluster: local
  - resources: default
  - job: default
  - _self_

# Hydra configuration
hydra:
  run:
    # Disable Hydra's automatic output directory management
    # We use OutputManager instead for consistent output structure
    dir: .
  output_subdir: null
  job:
    # Don't change working directory
    chdir: false
